name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub Release tag to build and attach assets to (e.g. v0.13.2-beta.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release-gate:
    name: Validate GitHub Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}

    steps:
      - name: Resolve and verify created GitHub Release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          TAG="$(echo "$TAG" | xargs)"
          if [[ -z "$TAG" ]]; then
            echo "::error::Release tag is required."
            exit 1
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Invalid SemVer release tag '$TAG'. Expected vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N."
            exit 1
          fi

          # Strictly ensure an existing GitHub Release has already been created for this tag.
          REL_JSON="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease 2>/dev/null || true)"
          if [[ -z "$REL_JSON" ]]; then
            echo "::error::No GitHub Release found for tag '$TAG'. Create the GitHub Release first; pushing code or tags alone does not trigger releases."
            exit 1
          fi

          IS_PRERELEASE="$(python3 -c "import json, sys; print(str(json.loads(sys.argv[1]).get('isPrerelease', False)).lower())" "$REL_JSON")"
          if [[ "$TAG" == *-* && "$IS_PRERELEASE" != "true" ]]; then
            echo "::warning::Tag '$TAG' includes a pre-release suffix, but the GitHub Release is not marked as pre-release."
          elif [[ "$TAG" != *-* && "$IS_PRERELEASE" == "true" ]]; then
            echo "::warning::Stable tag '$TAG' is marked as pre-release on GitHub."
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Verify Cargo.toml version matches release tag
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${RELEASE_TAG#v}"
          CARGO_VER="$(python3 -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('Cargo.toml').read_text(encoding='utf-8'))['workspace']['package']['version'])")"
          if [[ "$CARGO_VER" != "$EXPECTED" ]]; then
            echo "::error::Cargo.toml workspace version ($CARGO_VER) does not match release tag $RELEASE_TAG."
            exit 1
          fi
          echo "Verified Cargo.toml version: $CARGO_VER"

  build:
    name: Build Release (${{ matrix.target_name }})
    needs: release-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_name: windows-x64
            ext: ".exe"
          - os: ubuntu-latest
            target_name: linux-x64
            ext: ""

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-gate.outputs.tag }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgtk-3-dev libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Build size-optimized release binaries
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: cargo build --release -p mcw-desktop -p mcw-cli -p mcw-updater-app

      - name: Package Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "dist/mcw-launcher-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/mcw-desktop.exe" "$stage/MCW-Launcher.exe"
          Copy-Item "target/release/mcw-updater.exe" "$stage/mcw-updater.exe"
          Copy-Item "target/release/mcw-cli.exe" "$stage/mcw-cli.exe"
          Copy-Item ".env.example" "$stage/.env.example"
          Copy-Item "CHANGELOG.md" "$stage/CHANGELOG.md"
          Copy-Item "README.md" "$stage/README.md"
          Copy-Item "LICENSE" "$stage/LICENSE"
          if (Test-Path "themes") { Copy-Item -Recurse "themes" "$stage/themes" }
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/mcw-launcher-windows-x64.zip" -Force
          $hash = (Get-FileHash "dist/mcw-launcher-windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  mcw-launcher-windows-x64.zip" | Out-File -Encoding ascii "dist/mcw-launcher-windows-x64.zip.sha256"
          Get-Item "target/release/mcw-desktop.exe", "target/release/mcw-updater.exe", "dist/mcw-launcher-windows-x64.zip" | Select-Object Name, Length

      - name: Package Linux release archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          STAGE="dist/mcw-launcher-linux-x64"
          mkdir -p "$STAGE"
          cp target/release/mcw-desktop "$STAGE/mcw-launcher"
          cp target/release/mcw-updater "$STAGE/mcw-updater"
          cp target/release/mcw-cli "$STAGE/mcw-cli"
          chmod +x "$STAGE/mcw-launcher" "$STAGE/mcw-updater" "$STAGE/mcw-cli"
          cp .env.example CHANGELOG.md README.md LICENSE "$STAGE/"
          if [ -d "themes" ]; then cp -r themes "$STAGE/themes"; fi
          tar -C dist -czf dist/mcw-launcher-linux-x64.tar.gz mcw-launcher-linux-x64
          (cd dist && sha256sum mcw-launcher-linux-x64.tar.gz > mcw-launcher-linux-x64.tar.gz.sha256)
          ls -lh target/release/mcw-desktop dist/mcw-launcher-linux-x64.tar.gz

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcw-launcher-${{ matrix.target_name }}
          path: |
            dist/mcw-launcher-*.zip
            dist/mcw-launcher-*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  sign-windows:
    name: Authenticode Sign Windows Binaries (SignPath)
    needs: [release-gate, build]
    if: vars.SIGNPATH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download unsigned Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: mcw-launcher-windows-x64
          path: unsigned-windows

      - name: Submit SignPath Foundation signing request
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-name: mcw-launcher-windows-x64
          wait-for-completion: true
          output-artifact-directory: signed-windows

      - name: Package signed Windows artifact cleanly
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "signed-windows/signed" | Out-Null
          $zip = Get-ChildItem -Path "signed-windows" -Filter "*.zip" | Select-Object -First 1
          Move-Item -Force $zip.FullName "signed-windows/signed/mcw-launcher-windows-x64.zip"
          $hash = (Get-FileHash "signed-windows/signed/mcw-launcher-windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  mcw-launcher-windows-x64.zip" | Out-File -Encoding ascii "signed-windows/signed/mcw-launcher-windows-x64.zip.sha256"

      - name: Upload signed Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcw-launcher-windows-x64-signed
          path: |
            signed-windows/signed/mcw-launcher-windows-x64.zip
            signed-windows/signed/mcw-launcher-windows-x64.zip.sha256
          if-no-files-found: error

  publish-assets:
    name: Upload Assets to GitHub Release
    needs: [release-gate, build, sign-windows]
    if: ${{ !cancelled() && (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Prefer signed Windows artifact when available
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          if [ -f signed/mcw-launcher-windows-x64.zip ]; then
            mv -f signed/mcw-launcher-windows-x64.zip mcw-launcher-windows-x64.zip
            mv -f signed/mcw-launcher-windows-x64.zip.sha256 mcw-launcher-windows-x64.zip.sha256
            rmdir signed || true
          fi
          ls -lh

      - name: Verify archives and combine SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          test -f mcw-launcher-windows-x64.zip
          test -f mcw-launcher-linux-x64.tar.gz
          sha256sum --check ./*.sha256
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          ls -lh

      - name: Upload assets to existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh release upload "${{ needs.release-gate.outputs.tag }}"
          release-assets/mcw-launcher-windows-x64.zip
          release-assets/mcw-launcher-linux-x64.tar.gz
          release-assets/SHA256SUMS.txt
          --repo "${{ github.repository }}"
          --clobber
