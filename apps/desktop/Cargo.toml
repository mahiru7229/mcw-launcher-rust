[package]
name = "mcw-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mcw-desktop"
path = "src/main.rs"

[dependencies]
base64.workspace = true
eframe.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
mcw-auth.workspace = true
mcw-minecraft.workspace = true
mcw-models.workspace = true
mcw-mods.workspace = true
mcw-net.workspace = true
mcw-providers.workspace = true
mcw-runtime.workspace = true
mcw-storage.workspace = true
mcw-updater.workspace = true
notify.workspace = true
qrcode = { version = "0.14", default-features = false }
reqwest.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing = { workspace = true }
tracing-subscriber.workspace = true
webbrowser.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
