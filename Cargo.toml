[workspace]
resolver = "2"
members = [
    "crates/mcw-models",
    "crates/mcw-storage",
    "crates/mcw-net",
    "crates/mcw-auth",
    "crates/mcw-runtime",
    "crates/mcw-minecraft",
    "crates/mcw-mods",
    "crates/mcw-providers",
    "crates/mcw-updater",
    "apps/cli",
    "apps/desktop",
]

[workspace.package]
version = "0.13.1-beta.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
eframe = "0.31"
flate2 = "1.0"
futures = "0.3"
md-5 = "0.10"
rand = "0.8"
rayon = "1.10"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3.15"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.12", features = ["v3", "v4", "serde"] }
walkdir = "2.5"
webbrowser = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# Internal crates
mcw-models = { path = "crates/mcw-models" }
mcw-storage = { path = "crates/mcw-storage" }
mcw-net = { path = "crates/mcw-net" }
mcw-auth = { path = "crates/mcw-auth" }
mcw-runtime = { path = "crates/mcw-runtime" }
mcw-minecraft = { path = "crates/mcw-minecraft" }
mcw-mods = { path = "crates/mcw-mods" }
mcw-providers = { path = "crates/mcw-providers" }
mcw-updater = { path = "crates/mcw-updater" }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
